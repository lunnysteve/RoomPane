<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time / Weather / Humidity (three.js)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="three_common.css" />
  <style>
    /* three equal cells; the scene draws each icon in the upper part, text fills the rest */
    .stage { grid-template-columns: repeat(3, 1fr); }
    .cell { justify-content: flex-end; padding-bottom: 5vh; }
    .big { font-size: min(10.8vw, 21vh); }
    .label { margin-top: 1.4vh; font-size: min(2.4vw, 4.6vh); }
    .sub { margin-top: 0.8vh; font-size: min(1.9vw, 3.6vh); }
    @media (max-aspect-ratio: 11/10) { /* portrait: icon left, text right, three rows */
      .stage { grid-template-columns: 1fr; grid-template-rows: repeat(3, 1fr); }
      .cell { padding: 0 3vw 0 46%; justify-content: center; }
      .big { font-size: min(14vw, 6.5vh); }
      .label { font-size: min(3.4vw, 1.9vh); margin-top: 0.6vh; }
      .sub { font-size: min(3vw, 1.6vh); margin-top: 0.4vh; }
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="stage">
    <div class="cell">
      <div class="big" id="time">--<span class="colon">:</span>--</div>
      <div class="label" id="date">&nbsp;</div>
    </div>
    <div class="cell">
      <div class="big" id="temp">--<span class="unit">°C</span></div>
      <div class="label" id="condition">Loading</div>
      <div class="sub" id="feels">&nbsp;</div>
    </div>
    <div class="cell">
      <div class="big" id="hum">--<span class="unit">%</span></div>
      <div class="label">Humidity</div>
      <div class="sub" id="humWord">&nbsp;</div>
    </div>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const state = { w: null };
    let lib = null;
    try { lib = await import('./three_lib.js'); } catch (e) { console.warn('three.js unavailable, text only', e); }
    // text layer needs the clock/weather helpers even if WebGL failed, so they are re-read from the lib when present
    const londonNow = lib ? lib.londonNow : () => { const d = new Date(); return { h: d.getHours(), m: d.getMinutes(), s: d.getSeconds(), ms: d.getMilliseconds() }; };
    const dateText = lib ? lib.dateText : () => new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    const humWord = lib ? lib.humWord : (h) => (h < 30 ? 'Dry' : h < 60 ? 'Comfortable' : h < 75 ? 'Humid' : 'Very humid');

    let lastTime = '', lastDate = '', lastHum = null;
    function clockText() {
      const t = londonNow(), hh = String(t.h).padStart(2, '0'), mm = String(t.m).padStart(2, '0');
      if (hh + mm !== lastTime) { lastTime = hh + mm; $('time').innerHTML = `${hh}<span class="colon">:</span>${mm}`; }
      const d = dateText(); if (d !== lastDate) { lastDate = d; $('date').textContent = d; }
    }
    async function refresh() {
      if (!lib) return;
      try {
        const w = await lib.fetchWeatherData(); state.w = w;
        $('temp').innerHTML = `${w.temp}<span class="unit">°C</span>`;
        $('condition').textContent = w.label; $('feels').textContent = `Feels like ${w.feels}°`; $('humWord').textContent = humWord(w.hum);
      } catch (e) { if (!state.w) $('condition').textContent = 'Weather unavailable'; }
    }

    clockText(); refresh(); setInterval(refresh, 5 * 60 * 1000);
    if (lib) {
      const { createStage, makeDial, makeDroplet, weatherIconSlot } = lib;
      const stage = createStage($('gl')), dial = makeDial(), drop = makeDroplet(), icon = weatherIconSlot(stage);
      stage.add(dial.group); stage.add(drop.group);
      const spots = [{}, {}, {}];
      stage.onResize(({ a, portrait }) => {
        const cw = portrait ? 2 * a : (2 * a) / 3, ch = portrait ? 2 / 3 : 2;
        for (let i = 0; i < 3; i++) {
          const cx = portrait ? 0 : -a + cw * (i + 0.5), cy = portrait ? 1 - ch * (i + 0.5) : 0;
          spots[i] = portrait
            ? { x: -a + cw * 0.25, y: cy, s: Math.min(cw * 0.2, ch * 0.34) } // icon left, text right
            : { x: cx, y: cy + ch * 0.17, s: Math.min(cw * 0.46, ch * 0.3) };  // icon above the text, as large as the cell allows without touching the edges
        }
      });
      let lastText = 0;
      stage.start((t, dt) => {
        if (t - lastText > 0.25) { lastText = t; clockText(); }
        const kind = state.w ? state.w.kind : 'cloudy';
        stage.setKind(kind);
        dial.update(); stage.place(dial.group, spots[0].x, spots[0].y, spots[0].s);
        icon.update(t, dt, kind, spots[1].x, spots[1].y, spots[1].s);
        drop.update(t, dt, state.w ? state.w.hum : 0); stage.place(drop.group, spots[2].x, spots[2].y, spots[2].s * 0.92);
        const shown = Math.round(drop.shown);
        if (state.w && shown !== lastHum) { lastHum = shown; $('hum').innerHTML = `${shown}<span class="unit">%</span>`; }
      });
    }
  </script>
</body>
</html>
