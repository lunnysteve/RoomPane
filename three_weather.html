<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather (three.js)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="three_common.css" />
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="stage split">
    <div class="panel">
      <div class="big" id="temp">--<span class="unit">°C</span></div>
      <div class="label" id="condition">Loading</div>
      <div class="chips">
        <div class="chip"><b id="feels">--°</b><span>Feels like</span></div>
        <div class="chip"><b id="hilo">--° / --°</b><span>High / Low</span></div>
        <div class="chip"><b id="wind">-- mph</b><span>Wind</span></div>
        <div class="chip"><b id="rain">--%</b><span>Rain chance</span></div>
      </div>
    </div>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const state = { w: null };
    let lib = null;
    try { lib = await import('./three_lib.js'); } catch (e) { console.warn('three.js unavailable, text only', e); }

    async function refresh() {
      if (!lib) return;
      try {
        const w = await lib.fetchWeatherData(); state.w = w;
        $('temp').innerHTML = `${w.temp}<span class="unit">°C</span>`; $('condition').textContent = w.label;
        $('feels').textContent = `${w.feels}°`; $('hilo').textContent = `${w.hi}° / ${w.lo}°`;
        $('wind').textContent = `${Math.round(w.wind * 0.621371)} mph`; $('rain').textContent = `${w.rain}%`;
      } catch (e) { if (!state.w) $('condition').textContent = 'Weather unavailable'; }
    }
    refresh(); setInterval(refresh, 5 * 60 * 1000);

    if (lib) {
      const { createStage, weatherIconSlot } = lib, stage = createStage($('gl')), icon = weatherIconSlot(stage);
      let spot = { x: 0, y: 0, s: 0.8 };
      stage.onResize(({ a, portrait }) => {
        spot = portrait ? { x: 0, y: 0.5, s: Math.min(a * 0.8, 0.4) } : { x: -a * 0.5, y: 0.02, s: Math.min(0.9, a * 0.44) };
      });
      stage.start((t, dt) => {
        const kind = state.w ? state.w.kind : 'cloudy';
        stage.setKind(kind); icon.update(t, dt, kind, spot.x, spot.y, spot.s);
      });
    }
  </script>
</body>
</html>
