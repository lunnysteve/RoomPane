<!DOCTYPE html>
<html lang="en" class="h-full bg-black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lower Earley - Time, Temp & Humidity</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=JetBrains+Mono:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          animation: {
            'spin-very-slow': 'spin 24s linear infinite',
            'spin-slow': 'spin 12s linear infinite',
            'float-slow': 'float 5s ease-in-out infinite',
            'float-delayed': 'float 6s ease-in-out 1.5s infinite',
            'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
            'rain-drop': 'rainDrop 0.85s linear infinite',
            'mist-drift': 'mistDrift 4s ease-in-out infinite alternate',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-12px)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.45', transform: 'scale(1)' },
              '50%': { opacity: '0.9', transform: 'scale(1.06)' },
            },
            rainDrop: {
              '0%': { transform: 'translateY(-15px)', opacity: '0' },
              '40%': { opacity: '1' },
              '100%': { transform: 'translateY(30px)', opacity: '0' }
            },
            mistDrift: {
              '0%': { transform: 'translateX(-10px)' },
              '100%': { transform: 'translateX(10px)' }
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      user-select: none;
      background-color: #020617;
    }

    .glow-cyan-mega {
      text-shadow: 0 0 60px rgba(56, 189, 248, 0.5), 0 0 120px rgba(14, 165, 233, 0.2);
    }
    .glow-amber-mega {
      text-shadow: 0 0 50px rgba(251, 191, 36, 0.5), 0 0 100px rgba(245, 158, 11, 0.2);
    }
    .glow-sky-mega {
      text-shadow: 0 0 50px rgba(56, 189, 248, 0.5), 0 0 100px rgba(3, 105, 161, 0.2);
    }

    /* Screen burn-in prevention subtle drift */
    @keyframes ambient-shift {
      0% { transform: translate(0px, 0px); }
      25% { transform: translate(2px, -2px); }
      50% { transform: translate(-2px, 2px); }
      75% { transform: translate(2px, 2px); }
      100% { transform: translate(0px, 0px); }
    }
    .burn-in-safe {
      animation: ambient-shift 180s ease-in-out infinite;
    }
  </style>
</head>

<body class="h-screen w-screen text-slate-100 flex flex-col justify-between p-4 sm:p-6 lg:p-8 relative selection:bg-cyan-500/30 overflow-hidden">

  <!-- Minimal Transparent Controls (Top Right) -->
  <div class="fixed top-4 right-4 z-50 flex items-center gap-2 opacity-25 hover:opacity-100 transition-opacity duration-300">
    <button id="format-toggle" title="Toggle 12H / 24H" class="px-2.5 py-1 rounded-lg text-xs font-mono font-semibold text-slate-400 hover:text-white bg-white/5 hover:bg-white/15 transition-all">
      <span id="format-label">24H</span>
    </button>
    <button id="unit-toggle" title="Toggle °C / °F" class="px-2.5 py-1 rounded-lg text-xs font-mono font-semibold text-slate-400 hover:text-white bg-white/5 hover:bg-white/15 transition-all">
      <span id="unit-label">°C</span>
    </button>
    <button id="fullscreen-btn" title="Toggle Fullscreen" class="p-1.5 rounded-lg text-slate-400 hover:text-white bg-white/5 hover:bg-white/15 transition-all">
      <i data-lucide="maximize-2" id="fullscreen-icon" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- Main Viewport Full Real-Estate Container -->
  <main class="burn-in-safe w-full h-full flex flex-col justify-between items-center py-2 sm:py-4">

    <!-- 1. TIME: Dominates the Top Half (~55% Viewport Height) -->
    <div class="w-full flex-1 flex flex-col items-center justify-center my-auto">
      <div class="flex items-baseline justify-center tracking-tighter w-full text-center">
        <span id="clock-hours" class="text-[20vw] sm:text-[22vh] md:text-[26vh] font-black text-white font-mono glow-cyan-mega leading-none">--</span>
        <span id="clock-colon" class="text-[18vw] sm:text-[20vh] md:text-[24vh] font-light text-cyan-400 font-mono leading-none animate-pulse mx-1 sm:mx-3">:</span>
        <span id="clock-minutes" class="text-[20vw] sm:text-[22vh] md:text-[26vh] font-black text-white font-mono glow-cyan-mega leading-none">--</span>
        
        <!-- Seconds & AM/PM Column -->
        <div class="flex flex-col items-start ml-2 sm:ml-4 self-center sm:self-auto">
          <span id="clock-seconds" class="text-4xl sm:text-6xl md:text-[8vh] font-extrabold font-mono text-cyan-300/85 leading-none">--</span>
          <span id="clock-ampm" class="text-sm sm:text-lg md:text-xl font-bold font-mono tracking-widest text-slate-500 uppercase mt-2 hidden">PM</span>
        </div>
      </div>

      <!-- Live Second Sweep Progress Line -->
      <div class="w-full max-w-4xl bg-slate-900/90 rounded-full h-2 overflow-hidden mt-3 sm:mt-6 border border-white/5">
        <div id="seconds-bar" class="bg-gradient-to-r from-cyan-500 via-sky-400 to-indigo-500 h-full rounded-full transition-all duration-100 ease-linear shadow-lg" style="width: 0%;"></div>
      </div>
    </div>

    <!-- 2 & 3. BOTTOM ROW: Temperature and Humidity (~45% Viewport Height) -->
    <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-16 items-center justify-items-center flex-1 max-w-7xl mx-auto px-4">
      
      <!-- ITEM 2: TEMPERATURE -->
      <div class="flex items-center justify-center gap-6 sm:gap-10 w-full">
        <!-- Large Animated SVG Weather Icon -->
        <div id="weather-anim-icon" class="w-28 h-28 sm:w-40 sm:h-40 md:w-48 md:h-48 flex-shrink-0 flex items-center justify-center animate-float-slow">
          <!-- Dynamic Animated Weather SVG inserted by JS -->
        </div>

        <!-- Temperature Value -->
        <div class="flex flex-col justify-center">
          <span class="text-xs sm:text-sm md:text-base font-bold uppercase tracking-widest text-amber-400/80">Temperature</span>
          <div class="flex items-baseline gap-1">
            <span id="current-temp" class="text-7xl sm:text-[13vw] md:text-[15vh] font-black text-white font-mono tracking-tighter glow-amber-mega leading-none">--</span>
            <span id="temp-symbol" class="text-3xl sm:text-5xl md:text-6xl font-extrabold text-amber-300 font-mono">°C</span>
          </div>
          <p id="weather-desc" class="text-sm sm:text-lg md:text-xl font-semibold text-slate-300 mt-1">Loading...</p>
        </div>
      </div>

      <!-- ITEM 3: HUMIDITY -->
      <div class="flex items-center justify-center gap-6 sm:gap-10 w-full">
        <!-- Large Animated SVG Water Droplet Icon -->
        <div id="humidity-anim-icon" class="w-28 h-28 sm:w-40 sm:h-40 md:w-48 md:h-48 flex-shrink-0 flex items-center justify-center animate-float-delayed">
          <svg class="w-full h-full filter drop-shadow-[0_0_25px_rgba(56,189,248,0.55)]" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="dropGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#0284c7" />
              </linearGradient>
              <linearGradient id="dropGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7dd3fc" />
                <stop offset="100%" stop-color="#0369a1" />
              </linearGradient>
            </defs>
            <!-- Secondary Droplet Background -->
            <path class="animate-pulse-glow" d="M30 45 C30 36 42 22 42 22 C42 22 54 36 54 45 C54 52 48.6 57 42 57 C35.4 57 30 52 30 45 Z" fill="url(#dropGrad2)" opacity="0.6" />
            <!-- Main Droplet -->
            <path class="animate-float-slow" d="M48 24 C48 10 65 -4 65 -4 C65 -4 82 10 82 24 C82 33.4 74.4 41 65 41 C55.6 41 48 33.4 48 24 Z" transform="translate(-8, 26)" fill="url(#dropGrad1)" />
            <!-- Specular Highlight -->
            <ellipse cx="53" cy="46" rx="3.5" ry="6" transform="rotate(-30 53 46)" fill="#ffffff" opacity="0.7" />
            <!-- Rising Vapor Particles -->
            <circle cx="28" cy="28" r="3.5" fill="#38bdf8" class="animate-rain-drop" style="animation-duration: 2s; animation-direction: reverse;" />
            <circle cx="76" cy="32" r="2.5" fill="#7dd3fc" class="animate-rain-drop" style="animation-duration: 1.6s; animation-direction: reverse; animation-delay: 0.7s;" />
          </svg>
        </div>

        <!-- Humidity Value -->
        <div class="flex flex-col justify-center">
          <span class="text-xs sm:text-sm md:text-base font-bold uppercase tracking-widest text-sky-400/80">Humidity</span>
          <div class="flex items-baseline gap-1">
            <span id="current-humidity" class="text-7xl sm:text-[13vw] md:text-[15vh] font-black text-white font-mono tracking-tighter glow-sky-mega leading-none">--%</span>
          </div>
          <p id="humidity-status" class="text-sm sm:text-lg md:text-xl font-semibold text-slate-300 mt-1">Measuring...</p>
        </div>
      </div>

    </div>

  </main>

  <script>
    // State management
    const state = {
      is24Hour: true,
      isCelsius: true,
      latitude: 51.428,
      longitude: -0.932,
      weatherData: null,
      isDaytime: true
    };

    // Vector Animated SVG Weather Icon Generators
    const animatedWeatherSVGs = {
      // Clear Sun
      sunny: () => `
        <svg class="w-full h-full filter drop-shadow-[0_0_25px_rgba(251,191,36,0.65)]" viewBox="0 0 100 100" fill="none">
          <defs>
            <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fffbeb" />
              <stop offset="60%" stop-color="#f59e0b" />
              <stop offset="100%" stop-color="#d97706" />
            </radialGradient>
          </defs>
          <g class="animate-spin-very-slow origin-center">
            ${[0, 45, 90, 135, 180, 225, 270, 315].map(deg => `
              <line x1="50" y1="12" x2="50" y2="2" stroke="#fcd34d" stroke-width="4.5" stroke-linecap="round" transform="rotate(${deg} 50 50)" />
            `).join('')}
          </g>
          <circle cx="50" cy="50" r="23" fill="url(#sunCore)" class="animate-pulse-glow origin-center" />
        </svg>
      `,

      // Clear Moon (Night)
      clearNight: () => `
        <svg class="w-full h-full filter drop-shadow-[0_0_25px_rgba(165,180,252,0.65)]" viewBox="0 0 100 100" fill="none">
          <defs>
            <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="50%" stop-color="#c7d2fe" />
              <stop offset="100%" stop-color="#818cf8" />
            </linearGradient>
          </defs>
          <path d="M54 22 C37 22 24 35 24 52 C24 69 37 82 54 82 C65 82 74 76 79 67 C66 69 53 58 53 44 C53 34 58 26 66 22 C62 22 58 22 54 22 Z" fill="url(#moonGrad)" class="animate-float-slow" />
        </svg>
      `,

      // Partly Cloudy (Day)
      partlyCloudyDay: () => `
        <svg class="w-full h-full filter drop-shadow-[0_0_22px_rgba(251,191,36,0.45)]" viewBox="0 0 100 100" fill="none">
          <defs>
            <radialGradient id="sunPart" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fef08a" />
              <stop offset="100%" stop-color="#f59e0b" />
            </radialGradient>
            <linearGradient id="cloudGradPart" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#94a3b8" />
            </linearGradient>
          </defs>
          <g class="animate-spin-very-slow origin-[35px_35px]" transform="translate(-10, -10)">
            ${[0, 60, 120, 180, 240, 300].map(deg => `
              <line x1="45" y1="18" x2="45" y2="10" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" transform="rotate(${deg} 45 45)" />
            `).join('')}
            <circle cx="45" cy="45" r="17" fill="url(#sunPart)" />
          </g>
          <path class="animate-float-slow" d="M32 72 C22 72 14 64 14 54 C14 45 21 38 30 37 C34 26 44 19 56 19 C70 19 82 29 84 42 C91 43 96 49 96 57 C96 65 89 72 81 72 Z" fill="url(#cloudGradPart)" />
        </svg>
      `,

      // Partly Cloudy (Night)
      partlyCloudyNight: () => `
        <svg class="w-full h-full filter drop-shadow-[0_0_22px_rgba(165,180,252,0.45)]" viewBox="0 0 100 100" fill="none">
          <defs>
            <linearGradient id="cloudNightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#e2e8f0" />
              <stop offset="100%" stop-color="#64748b" />
            </linearGradient>
          </defs>
          <path d="M42 20 C32 20 23 28 23 38 C23 48 32 56 42 56 C49 56 54 52 57 47 C48 48 41 41 41 32 C41 25 45 20 50 17 C47 19 44 20 42 20 Z" fill="#c7d2fe" />
          <path class="animate-float-slow" d="M32 72 C22 72 14 64 14 54 C14 45 21 38 30 37 C34 26 44 19 56 19 C70 19 82 29 84 42 C91 43 96 49 96 57 C96 65 89 72 81 72 Z" fill="url(#cloudNightGrad)" />
        </svg>
      `,

      // Overcast Skies
      overcast: () => `
        <svg class="w-full h-full filter drop-shadow-[0_0_20px_rgba(148,163,184,0.45)]" viewBox="0 0 100 100" fill="none">
          <defs>
            <linearGradient id="overcastGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#94a3b8" />
              <stop offset="100%" stop-color="#475569" />
            </linearGradient>
            <linearGradient id="overcastGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#e2e8f0" />
              <stop offset="100%" stop-color="#64748b" />
            </linearGradient>
          </defs>
          <path class="animate-float-delayed" d="M22 55 C15 55 10 50 10 43 C10 36 15 31 22 30 C25 22 33 17 42 17 C52 17 61 24 63 34 C68 35 72 39 72 45 C72 51 67 55 61 55 Z" fill="url(#overcastGrad1)" opacity="0.7" />
          <path class="animate-float-slow" d="M32 76 C22 76 14 68 14 58 C14 49 21 42 30 41 C34 30 44 23 56 23 C70 23 82 33 84 46 C91 47 96 53 96 61 C96 69 89 76 81 76 Z" fill="url(#overcastGrad2)" />
        </svg>
      `,

      // Rain / Showers
      rain: () => `
        <svg class="w-full h-full filter drop-shadow-[0_0_22px_rgba(56,189,248,0.55)]" viewBox="0 0 100 100" fill="none">
          <defs>
            <linearGradient id="rainCloud" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#cbd5e1" />
              <stop offset="100%" stop-color="#475569" />
            </linearGradient>
          </defs>
          <path class="animate-float-slow" d="M28 58 C20 58 14 52 14 44 C14 37 19 31 26 30 C29 21 38 15 48 15 C60 15 70 23 72 34 C78 35 82 40 82 46 C82 53 77 58 70 58 Z" fill="url(#rainCloud)" />
          <g>
            <line x1="28" y1="66" x2="24" y2="76" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" class="animate-rain-drop" style="animation-delay: 0s;" />
            <line x1="42" y1="66" x2="38" y2="76" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" class="animate-rain-drop" style="animation-delay: 0.3s;" />
            <line x1="56" y1="66" x2="52" y2="76" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" class="animate-rain-drop" style="animation-delay: 0.6s;" />
            <line x1="70" y1="66" x2="66" y2="76" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" class="animate-rain-drop" style="animation-delay: 0.2s;" />
          </g>
        </svg>
      `,

      // Thunderstorm
      thunderstorm: () => `
        <svg class="w-full h-full filter drop-shadow-[0_0_26px_rgba(250,204,21,0.65)]" viewBox="0 0 100 100" fill="none">
          <defs>
            <linearGradient id="stormCloud" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#475569" />
              <stop offset="100%" stop-color="#1e293b" />
            </linearGradient>
          </defs>
          <path class="animate-float-slow" d="M28 54 C20 54 14 48 14 40 C14 33 19 27 26 26 C29 17 38 11 48 11 C60 11 70 19 72 30 C78 31 82 36 82 42 C82 49 77 54 70 54 Z" fill="url(#stormCloud)" />
          <polygon points="48,50 36,68 46,68 42,88 58,64 48,64 54,50" fill="#facc15" class="animate-pulse-glow" />
        </svg>
      `,

      // Snow
      snow: () => `
        <svg class="w-full h-full filter drop-shadow-[0_0_22px_rgba(224,242,254,0.7)]" viewBox="0 0 100 100" fill="none">
          <defs>
            <linearGradient id="snowCloud" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#94a3b8" />
            </linearGradient>
          </defs>
          <path class="animate-float-slow" d="M28 54 C20 54 14 48 14 40 C14 33 19 27 26 26 C29 17 38 11 48 11 C60 11 70 19 72 30 C78 31 82 36 82 42 C82 49 77 54 70 54 Z" fill="url(#snowCloud)" />
          <g class="animate-spin-slow origin-[35px_70px]">
            <circle cx="35" cy="70" r="3.5" fill="#e0f2fe" />
            <line x1="35" y1="64" x2="35" y2="76" stroke="#e0f2fe" stroke-width="2" />
            <line x1="29" y1="70" x2="41" y2="70" stroke="#e0f2fe" stroke-width="2" />
          </g>
          <g class="animate-spin-slow origin-[60px_72px]" style="animation-delay: 1.5s;">
            <circle cx="60" cy="72" r="3.5" fill="#e0f2fe" />
            <line x1="60" y1="66" x2="60" y2="78" stroke="#e0f2fe" stroke-width="2" />
            <line x1="54" y1="72" x2="66" y2="72" stroke="#e0f2fe" stroke-width="2" />
          </g>
        </svg>
      `,

      // Fog / Mist
      fog: () => `
        <svg class="w-full h-full filter drop-shadow-[0_0_20px_rgba(203,213,225,0.5)]" viewBox="0 0 100 100" fill="none">
          <rect x="18" y="32" width="64" height="6.5" rx="3.25" fill="#cbd5e1" class="animate-mist-drift" opacity="0.8" />
          <rect x="12" y="46" width="76" height="7.5" rx="3.75" fill="#94a3b8" class="animate-mist-drift" style="animation-duration: 5s; animation-delay: 0.5s;" opacity="0.9" />
          <rect x="22" y="60" width="56" height="6.5" rx="3.25" fill="#cbd5e1" class="animate-mist-drift" style="animation-duration: 3.5s; animation-delay: 1s;" opacity="0.7" />
          <rect x="30" y="74" width="40" height="5.5" rx="2.75" fill="#64748b" class="animate-mist-drift" style="animation-duration: 4.5s;" opacity="0.6" />
        </svg>
      `
    };

    function getWeatherPresentation(code, isDay) {
      if (code === 0) {
        return {
          label: isDay ? 'Clear & Sunny' : 'Clear & Starlit',
          svg: isDay ? animatedWeatherSVGs.sunny() : animatedWeatherSVGs.clearNight(),
        };
      }
      if (code === 1 || code === 2) {
        return {
          label: isDay ? 'Partly Sunny' : 'Partly Cloudy',
          svg: isDay ? animatedWeatherSVGs.partlyCloudyDay() : animatedWeatherSVGs.partlyCloudyNight(),
        };
      }
      if (code === 3) {
        return {
          label: 'Overcast Skies',
          svg: animatedWeatherSVGs.overcast(),
        };
      }
      if (code === 45 || code === 48) {
        return {
          label: 'Misty / Foggy',
          svg: animatedWeatherSVGs.fog(),
        };
      }
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
        return {
          label: code >= 65 || code === 82 ? 'Heavy Showers' : 'Rain Showers',
          svg: animatedWeatherSVGs.rain(),
        };
      }
      if ((code >= 71 && code <= 77) || code === 85 || code === 86) {
        return {
          label: 'Snowing',
          svg: animatedWeatherSVGs.snow(),
        };
      }
      if (code >= 95) {
        return {
          label: 'Thunderstorm',
          svg: animatedWeatherSVGs.thunderstorm(),
        };
      }
      return {
        label: 'Fair Weather',
        svg: isDay ? animatedWeatherSVGs.partlyCloudyDay() : animatedWeatherSVGs.partlyCloudyNight(),
      };
    }

    // High Precision Time Engine
    function updateClock() {
      const now = new Date();
      
      const ukFormatter = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/London',
        hour: 'numeric',
        minute: 'numeric',
        second: 'numeric',
        hour12: !state.is24Hour
      });

      const parts = ukFormatter.formatToParts(now);
      const values = {};
      parts.forEach(p => values[p.type] = p.value);

      let hours = values.hour || '00';
      let minutes = values.minute || '00';
      let seconds = values.second || '00';
      let dayPeriod = values.dayPeriod || '';

      if (hours.length === 1 && state.is24Hour) hours = '0' + hours;
      if (minutes.length === 1) minutes = '0' + minutes;
      if (seconds.length === 1) seconds = '0' + seconds;

      document.getElementById('clock-hours').textContent = hours;
      document.getElementById('clock-minutes').textContent = minutes;
      document.getElementById('clock-seconds').textContent = seconds;

      const ampmEl = document.getElementById('clock-ampm');
      if (!state.is24Hour && dayPeriod) {
        ampmEl.textContent = dayPeriod;
        ampmEl.classList.remove('hidden');
      } else {
        ampmEl.classList.add('hidden');
      }

      // Smooth seconds sweep bar
      const secNum = parseInt(seconds, 10);
      const secPercent = ((secNum + (now.getMilliseconds() / 1000)) / 60) * 100;
      document.getElementById('seconds-bar').style.width = `${secPercent}%`;
    }

    // Fetch Lower Earley Weather Telemetry
    async function fetchLowerEarleyWeather() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${state.latitude}&longitude=${state.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code&timezone=Europe%2FLondon`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Station unreachable');
        const data = await res.json();
        state.weatherData = data;
        renderWeather(data);
      } catch (err) {
        console.warn('Fallback weather rendering:', err);
        renderFallbackWeather();
      }
    }

    function formatTemperatureValue(valInCelsius) {
      if (valInCelsius === null || valInCelsius === undefined) return '--';
      if (!state.isCelsius) {
        return Math.round((valInCelsius * 9/5) + 32);
      }
      return Math.round(valInCelsius);
    }

    function renderWeather(data) {
      const current = data.current;
      state.isDaytime = current.is_day === 1;

      const presentation = getWeatherPresentation(current.weather_code, state.isDaytime);

      // Render Temperature
      const tempVal = formatTemperatureValue(current.temperature_2m);
      document.getElementById('current-temp').textContent = tempVal;
      document.getElementById('temp-symbol').textContent = state.isCelsius ? '°C' : '°F';
      document.getElementById('weather-desc').textContent = presentation.label;
      document.getElementById('weather-anim-icon').innerHTML = presentation.svg;

      // Render Humidity
      const humidityVal = Math.round(current.relative_humidity_2m);
      document.getElementById('current-humidity').textContent = `${humidityVal}%`;
      
      let humDesc = 'Comfortable';
      if (humidityVal > 80) humDesc = 'Very Humid';
      else if (humidityVal > 65) humDesc = 'Moderate Moisture';
      else if (humidityVal < 35) humDesc = 'Dry Air';
      document.getElementById('humidity-status').textContent = humDesc;
    }

    function renderFallbackWeather() {
      renderWeather({
        current: {
          temperature_2m: 16.4,
          relative_humidity_2m: 76,
          is_day: 0,
          weather_code: 1
        }
      });
    }

    function setupControls() {
      // 12H / 24H Toggle
      const formatBtn = document.getElementById('format-toggle');
      const formatLabel = document.getElementById('format-label');
      formatBtn.addEventListener('click', () => {
        state.is24Hour = !state.is24Hour;
        formatLabel.textContent = state.is24Hour ? '24H' : '12H';
        updateClock();
      });

      // °C / °F Toggle
      const unitBtn = document.getElementById('unit-toggle');
      const unitLabel = document.getElementById('unit-label');
      unitBtn.addEventListener('click', () => {
        state.isCelsius = !state.isCelsius;
        unitLabel.textContent = state.isCelsius ? '°C' : '°F';
        if (state.weatherData) {
          renderWeather(state.weatherData);
        } else {
          renderFallbackWeather();
        }
      });

      // Fullscreen Toggle
      const fsBtn = document.getElementById('fullscreen-btn');
      const fsIcon = document.getElementById('fullscreen-icon');
      fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          fsIcon.setAttribute('data-lucide', 'minimize-2');
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
            fsIcon.setAttribute('data-lucide', 'maximize-2');
          }
        }
        setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 150);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
      setupControls();
      
      // Clock tick loop
      updateClock();
      setInterval(updateClock, 100);

      // Weather data polling (5 min interval)
      fetchLowerEarleyWeather();
      setInterval(fetchLowerEarleyWeather, 300000);
    });
  </script>
</body>
</html>
