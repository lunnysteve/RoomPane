<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky tonight (three.js)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="three_common.css" />
  <style>
    /* labels are placed in pixels by the script so they line up with things in the scene */
    .top { position: fixed; left: 0; right: 0; top: 5vh; z-index: 1; text-align: center; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.45); animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .top .big { font-size: min(8.6vw, 16vh); }
    .top .label { margin-top: 1vh; font-size: min(2.2vw, 4.2vh); }
    .tag { position: fixed; z-index: 1; transform: translate(-50%, 0); text-align: center; white-space: nowrap; text-shadow: 0 3px 20px rgba(0, 0, 0, 0.5); }
    .tag b { display: block; font-size: min(3.6vw, 6.4vh); font-weight: 800; letter-spacing: -0.01em; }
    .tag span { display: block; margin-top: 0.4vh; font-size: min(1.6vw, 3vh); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.55); }
    @media (max-aspect-ratio: 11/10) {
      .top .big { font-size: min(13vw, 8vh); } .top .label { font-size: min(3.6vw, 2vh); }
      .tag b { font-size: min(6vw, 3.2vh); } .tag span { font-size: min(2.8vw, 1.5vh); }
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="top">
    <div class="big" id="count">--</div>
    <div class="label" id="sub">&nbsp;</div>
  </div>
  <div class="tag" id="tagRise"><b id="rise">--:--</b><span>Sunrise</span></div>
  <div class="tag" id="tagSet"><b id="set">--:--</b><span>Sunset</span></div>
  <div class="tag" id="tagMoon"><b id="moonName">--</b><span id="moonPct">&nbsp;</span></div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const state = { w: null };
    let lib = null;
    try { lib = await import('./three_lib.js'); } catch (e) { console.warn('three.js unavailable, text only', e); }

    // moon age in days from a known new moon (2000-01-06 18:14 UTC); good to a few hours, plenty for a wall display
    const SYNODIC = 29.530588853;
    function moonAge() { const jd = Date.now() / 86400000 + 2440587.5; return (((jd - 2451550.1) % SYNODIC) + SYNODIC) % SYNODIC; }
    function moonName(age) {
      return age < 1.85 ? 'New Moon' : age < 5.54 ? 'Waxing Crescent' : age < 9.22 ? 'First Quarter' : age < 12.91 ? 'Waxing Gibbous' :
        age < 16.61 ? 'Full Moon' : age < 20.3 ? 'Waning Gibbous' : age < 23.99 ? 'Last Quarter' : age < 27.68 ? 'Waning Crescent' : 'New Moon';
    }
    const dur = (ms) => { const m = Math.max(0, Math.round(ms / 60000)); return m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m` : `${m}m`; };

    // fill the text layer from the weather call's sun times
    function words() {
      const w = state.w; if (!w) return;
      const now = new Date(), age = moonAge(), illum = Math.round(((1 - Math.cos((age / SYNODIC) * 2 * Math.PI)) / 2) * 100);
      const day = now >= w.sunrise && now < w.sunset;
      const next = day ? w.sunset : now < w.sunrise ? w.sunrise : w.nextSunrise;
      $('count').textContent = `${day ? 'Sunset' : 'Sunrise'} in ${dur(next - now)}`;
      $('sub').textContent = `Day length ${dur(w.sunset - w.sunrise)}`;
      $('rise').textContent = lib.hhmm(w.sunrise); $('set').textContent = lib.hhmm(w.sunset);
      $('moonName').textContent = moonName(age); $('moonPct').textContent = `${illum}% lit`;
    }
    async function refresh() {
      if (!lib) return;
      try { state.w = await lib.fetchWeatherData(); words(); } catch (e) { if (!state.w) $('sub').textContent = 'Sky data unavailable'; }
    }
    refresh(); setInterval(refresh, 5 * 60 * 1000); setInterval(words, 30 * 1000);

    if (lib) {
      const { THREE, createStage, makeWeatherIcon, disc, bar, glow, rand } = lib, stage = createStage($('gl'));

      // procedural moon surface: pale grey with darker maria and a few craters
      const tex = (() => {
        const c = document.createElement('canvas'); c.width = 512; c.height = 256; const g = c.getContext('2d');
        g.fillStyle = '#cfd2d8'; g.fillRect(0, 0, 512, 256);
        for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(88,94,106,${rand(0.1, 0.32)})`; g.beginPath(); g.ellipse(rand(0, 512), rand(24, 232), rand(10, 46), rand(8, 36), rand(0, 3), 0, 7); g.fill(); }
        for (let i = 0; i < 90; i++) { const x = rand(0, 512), y = rand(10, 246), r = rand(2, 9); g.strokeStyle = 'rgba(70,74,84,0.28)'; g.lineWidth = 1.2; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke(); g.fillStyle = 'rgba(255,255,255,0.08)'; g.beginPath(); g.arc(x - 1, y - 1, r * 0.8, 0, 7); g.fill(); }
        return new THREE.CanvasTexture(c);
      })();
      const moon = new THREE.Mesh(new THREE.SphereGeometry(1, 56, 36), new THREE.MeshStandardMaterial({ map: tex, roughness: 1, metalness: 0 }));
      moon.rotation.y = 0.6; stage.add(moon);
      const sunLight = new THREE.DirectionalLight(0xffffff, 3), earthshine = new THREE.AmbientLight(0x2a3652, 1.1);
      stage.add(sunLight); stage.add(earthshine);
      const moonHalo = glow(1, 0xaabbee, 0.18, -0.02); stage.add(moonHalo);

      // dotted arc the sun (by day) or moon (by night) travels along
      const DOTS = 56, dots = Array.from({ length: DOTS }, () => { const d = disc(0.011, 0xffffff, 0.25, 0); stage.add(d); return d; });
      const horizon = bar(1, 0.004, 0xffffff, 0.35, 0); stage.add(horizon);
      const sunIcon = makeWeatherIcon('clear'), moonIcon = makeWeatherIcon('clear-night');
      stage.add(sunIcon.group); stage.add(moonIcon.group);

      let L = null; // layout in world units
      const px = (x, y) => { const s = stage.size(); return [((x / s.a + 1) / 2) * s.w, ((1 - y) / 2) * s.h]; };
      const tag = (id, x, y) => { const [l, t] = px(x, y), e = $(id); e.style.left = `${l}px`; e.style.top = `${t}px`; };
      stage.onResize(({ a, portrait }) => {
        L = portrait
          ? { W: a * 0.82, H: 0.32, hy: -0.18, moon: { x: 0, y: 0.5, r: Math.min(a * 0.34, 0.24) }, icon: 0.1 }
          : { W: a * 0.6, H: 0.74, hy: -0.4, moon: { x: a * 0.78, y: 0.3, r: 0.28 }, icon: 0.13 }; // arc stops short of the moon column so its label stays clear
        horizon.scale.set(L.W * 2.3, 0.004, 1); horizon.position.set(0, L.hy, 0);
        tag('tagRise', -L.W, L.hy - 0.05); tag('tagSet', L.W, L.hy - 0.05);
        tag('tagMoon', L.moon.x, L.moon.y - L.moon.r - 0.07);
      });
      const arc = (f) => [-L.W + 2 * L.W * f, L.hy + L.H * Math.sin(Math.PI * f)];

      let lastDots = 0;
      stage.start((t, dt) => {
        const w = state.w, now = new Date(), age = moonAge(), ang = (age / SYNODIC) * 2 * Math.PI;
        const day = w ? now >= w.sunrise && now < w.sunset : true;
        // sky colour: day, a warm band around sunrise/sunset, then night with stars
        let palette = day ? ['#2a5d93', '#0f2540'] : ['#0b132b', '#010409'];
        if (w) { const near = Math.min(Math.abs(now - w.sunrise), Math.abs(now - w.sunset)) / 60000; if (near < 40) palette = ['#b4573a', '#2a1840']; }
        stage.setScene({ palette, stars: !day });

        // moon sphere: lit from the side that matches the phase (new = from behind, full = from the front)
        stage.place(moon, L.moon.x, L.moon.y, L.moon.r);
        sunLight.position.set(Math.sin(ang) * 5, 0.5, -Math.cos(ang) * 5);
        moonHalo.position.set(L.moon.x, L.moon.y, -0.02); moonHalo.scale.setScalar(L.moon.r * 4.2);
        moonHalo.material.opacity = 0.05 + 0.2 * ((1 - Math.cos(ang)) / 2);

        // body on the arc: sun between sunrise and sunset, moon between sunset and the next sunrise
        let f = 0.5, body = day ? sunIcon : moonIcon;
        if (w) {
          if (day) f = (now - w.sunrise) / (w.sunset - w.sunrise);
          else if (now >= w.sunset) f = (now - w.sunset) / (w.nextSunrise - w.sunset);
          else f = (now - w.prevSunset) / (w.sunrise - w.prevSunset);
        }
        f = Math.min(Math.max(f, 0.001), 0.999);
        sunIcon.group.visible = day; moonIcon.group.visible = !day;
        const [bx, by] = arc(f); body.update(t, dt); stage.place(body.group, bx, by, L.icon);

        if (t - lastDots > 1) { // arc dots: brighter once the body has passed them
          lastDots = t;
          dots.forEach((d, i) => { const g = (i + 0.5) / DOTS, [x, y] = arc(g); d.position.set(x, y, 0); d.material.opacity = g < f ? 0.7 : 0.2; });
        }
      });
    }
  </script>
</body>
</html>
