<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time (three.js)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="three_common.css" />
  <style>
    .stage.split .big { font-size: min(19vw, 34vh); }
    .secs { font-size: 0.34em; font-weight: 800; color: rgba(255, 255, 255, 0.45); margin-left: 0.12em; letter-spacing: 0; }
    @media (max-aspect-ratio: 11/10) { .stage.split .big { font-size: min(24vw, 13vh); } }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="stage split">
    <div class="panel">
      <div class="big" id="time">--<span class="colon">:</span>--</div>
      <div class="label" id="date">&nbsp;</div>
    </div>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    let lib = null;
    try { lib = await import('./three_lib.js'); } catch (e) { console.warn('three.js unavailable, text only', e); }
    const londonNow = lib ? lib.londonNow : () => { const d = new Date(); return { h: d.getHours(), m: d.getMinutes(), s: d.getSeconds() }; };
    const dateText = lib ? lib.dateText : () => new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

    let last = '', lastDate = '';
    function clockText() {
      const t = londonNow(), hh = String(t.h).padStart(2, '0'), mm = String(t.m).padStart(2, '0'), ss = String(t.s).padStart(2, '0');
      if (hh + mm + ss !== last) { last = hh + mm + ss; $('time').innerHTML = `${hh}<span class="colon">:</span>${mm}<span class="secs">${ss}</span>`; }
      const d = dateText(); if (d !== lastDate) { lastDate = d; $('date').textContent = d; }
    }
    clockText(); setInterval(clockText, 250);

    if (lib) {
      const { createStage, makeDial } = lib, stage = createStage($('gl')), dial = makeDial();
      stage.add(dial.group);
      let spot = { x: 0, y: 0, s: 0.9 };
      stage.onResize(({ a, portrait }) => {
        spot = portrait ? { x: 0, y: 0.5, s: Math.min(a * 0.92, 0.44) } : { x: -a * 0.52, y: 0, s: Math.min(0.9, a * 0.42) }; // as big as the left half allows, leaving a gap before the digits
      });
      stage.start(() => {
        const h = londonNow().h, night = h < 7 || h >= 19;
        stage.setScene({ palette: night ? ['#0b132b', '#010409'] : ['#2a5d93', '#0f2540'], stars: night });
        dial.update(); stage.place(dial.group, spot.x, spot.y, spot.s);
      });
    }
  </script>
</body>
</html>
