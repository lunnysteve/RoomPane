<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roompane plugin</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#f1f5fb;background:#0b1324}*{box-sizing:border-box}body{margin:0;padding:clamp(10px,3vw,30px);overflow:hidden}h1{font-size:clamp(18px,4vw,34px);margin:0 0 14px}#message{color:#9eb0c5;font-size:clamp(12px,2.5vw,20px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:12px}.tile{padding:14px;background:#17263a;border:1px solid #29394e;border-radius:12px}.label{font-size:clamp(12px,2.5vw,22px);color:#adbed1}.value{font-size:clamp(20px,5vw,48px);margin-top:6px}.event{padding:12px 0;border-bottom:1px solid #29394e}.event-title{font-size:clamp(15px,3vw,26px)}.event-time{color:#87bfff;font-size:clamp(12px,2.2vw,18px);margin-top:4px}#photo{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}body.embedded{padding:10px}body.embedded h1{font-size:18px}body.embedded .tile{padding:10px}body.embedded .value{font-size:28px}#printer-progress{width:100%;height:18px;accent-color:#70b7ff}#items{overflow:auto;max-height:calc(100vh - 80px)}
</style></head><body><h1 id="title">Connecting…</h1><div id="message"></div><div id="items"></div><script src="/plugin-view.js"></script></body></html>
