<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Printer display</title><link rel="stylesheet" href="/design-assets.css"><style>*{box-sizing:border-box}html,body{margin:0;background:#0b1324;color:#f1f5fb;width:100%;height:100%;overflow:hidden;font-family:'Studio Sans',sans-serif}main{width:800px;height:480px;position:absolute;transform-origin:top left;padding:28px 36px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:30px;margin:0}#connection{font-size:16px;color:#87d4a4}#state{font-size:28px;color:#70b7ff;margin:18px 0 8px;text-transform:capitalize}#filename{font-size:18px;color:#adbed1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#progress{font-size:86px;font-weight:700;margin:10px 0 2px}.track{height:12px;background:#24334a;border-radius:6px;overflow:hidden}.bar{height:100%;background:#70b7ff;width:0}.stats{display:flex;gap:20px;margin-top:22px}.stats div{flex:1;background:#17263a;padding:15px;border-radius:12px}.stats small{display:block;font-size:15px;color:#adbed1}.stats strong{font-size:30px;display:block;margin-top:5px}#message{font-size:16px;color:#adbed1;margin-top:16px}</style></head><body><main id="printer"><header><h1 id="name">3D printer</h1><span id="connection">Connecting…</span></header><div id="state">Waiting for source</div><div id="filename">—</div><div id="progress">—</div><div class="track"><div class="bar" id="bar"></div></div><section class="stats"><div><small>Nozzle / target</small><strong id="nozzle">—</strong></div><div><small>Bed / target</small><strong id="bed">—</strong></div><div><small>Print time</small><strong id="duration">—</strong></div></section><p id="message"></p></main><script src="/plugin-mainsail.js"></script></body></html>
