name: Versioned release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts && npm test
      - run: python3 tests/updater-rollback.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed Android TV APK
        env:
          TV_KEYSTORE: ${{ secrets.ANDROID_TV_KEYSTORE }}
          HD_TV_STORE_PASSWORD: ${{ secrets.ANDROID_TV_STORE_PASSWORD }}
        run: |
          test -n "$TV_KEYSTORE"
          printf '%s' "$TV_KEYSTORE" | base64 -d > "$RUNNER_TEMP/tv-keystore.jks"
          export HD_TV_KEYSTORE="$RUNNER_TEMP/tv-keystore.jks"
          cd android-tv
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Package versioned artifacts
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="v$VERSION"
          test "$GITHUB_REF_NAME" = "$TAG"
          mkdir -p dist
          python3 tools/package-release.py
          cp android-tv/app/build/outputs/apk/release/app-release.apk "dist/home-display-tv-$TAG.apk"
          (cd dist && sha256sum *.tar.gz *.apk > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Home Display $GITHUB_REF_NAME"
