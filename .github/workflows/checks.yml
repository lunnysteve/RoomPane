name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python tests/updater-rollback.py
      - run: bash -n install.sh pi/update-studio.sh pi/kiosk-session && sh -n pi/home-display-control
      - run: python tests/package-smoke.py
      - run: python -m pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - name: Browser checks
        run: |
          python tests/display-browser.py
          python tests/studio-browser.py
          python tests/designer-browser.py
          python tests/plugin-browser.py
